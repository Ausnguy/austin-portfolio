<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Austin_Nguyen.xlsx | Austin Nguyen</title>
    <meta name="theme-color" content="#107C41" />
    <meta name="description" content="Austin Nguyen builds data systems end to end: pipelines, ML models, dashboards and the apps on top. Projects, experience, and a local AI you can ask about Austin." />
    <script>
      // Light by default; dark only if the visitor chose it with the toggle. Runs before first paint so there is no flash.
      (function () {
        var theme = null;
        try { theme = localStorage.getItem('theme'); } catch (e) {}
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
        }
      })();

      // GitHub Pages deep links: public/404.html sends /austin-portfolio/x/y here as ?/x/y.
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function (s) {
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
