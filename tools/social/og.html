<!doctype html>
<!-- Source for public/og.png (1200×630 link preview). Render with tools/social/render.cjs. -->
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; }
  body { width: 1200px; height: 630px; background: #f3f5f7; font-family: 'IBM Plex Sans', sans-serif; color: #1d2329; overflow: hidden; }
  .bar { height: 64px; background: #107c41; color: #fff; display: flex; align-items: center; gap: 14px; padding: 0 40px; font-size: 26px; font-weight: 600; }
  .bar span { opacity: .7; }
  .fx { height: 44px; background: #fff; border-bottom: 1px solid #e2e5e9; display: flex; align-items: center; font: 500 18px 'IBM Plex Mono', monospace; }
  .fx .ref { width: 96px; padding-left: 40px; color: #6a737d; }
  .fx .f { padding-left: 24px; border-left: 1px solid #e2e5e9; height: 100%; display: flex; align-items: center; }
  .grid { display: grid; grid-template-columns: 56px 1fr; background: #fff; height: 522px; }
  .rows { background: #f3f5f7; border-right: 1px solid #e2e5e9; font: 500 16px 'IBM Plex Mono', monospace; color: #6a737d; display: grid; grid-template-rows: 300px 1fr; }
  .rows div { padding: 18px 0 0 22px; border-bottom: 1px solid #e2e5e9; }
  .body { display: grid; grid-template-rows: 300px 1fr; }
  .hero { padding: 38px 56px; border-bottom: 1px solid #e2e5e9; position: relative; }
  .hero::after { content: ''; position: absolute; inset: 0; box-shadow: inset 0 0 0 3px #107c41; }
  h1 { font-size: 92px; font-weight: 700; letter-spacing: -2px; line-height: 1; }
  .tag { margin-top: 22px; font-size: 32px; line-height: 1.3; max-width: 980px; }
  .cells { display: grid; grid-template-columns: repeat(3, 1fr); }
  .cells > div { padding: 34px 40px 0 56px; border-right: 1px solid #e2e5e9; }
  .cells > div:last-child { border-right: 0; }
  .k { font-size: 20px; color: #6a737d; }
  .v { margin-top: 8px; font-size: 30px; font-weight: 600; line-height: 1.2; }
</style>
</head>
<body>
  <div class="bar"><b>▦</b><div>Austin_Nguyen<span>.xlsx</span></div></div>
  <div class="fx"><div class="ref">A1</div><div class="f">=TURN(messy_data, "decisions people act on")</div></div>
  <div class="grid">
    <div class="rows"><div>1</div><div>2</div></div>
    <div class="body">
      <div class="hero">
        <h1>Austin Nguyen</h1>
        <p class="tag">I build data systems end to end: the pipeline, the model, the dashboard and the app on top.</p>
      </div>
      <div class="cells">
        <div><div class="k">School</div><div class="v">MIS at UH Bauer<br>3.95 GPA</div></div>
        <div><div class="k">Now</div><div class="v">Data Analyst Intern<br>at HPE</div></div>
        <div><div class="k">Latest build</div><div class="v">Parvius<br>CaseQuest 2026</div></div>
      </div>
    </div>
  </div>
</body>
</html>
