<!doctype html>
<!-- Source for public/og.png (1200x630 link preview and LinkedIn thumbnail). Render with tools/social/render.cjs. -->
<html lang="en">
<head>

<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; }
  body { width: 1200px; height: 630px; position: relative; overflow: hidden; background: #ECE9E2; color: #0F0F0F; font-family: 'Archivo', sans-serif; }
  .rule { position: absolute; left: 64px; top: 64px; width: 72px; height: 10px; background: #2338FF; }

  .line { position: absolute; left: 64px; top: 394px; width: 380px; font-size: 29px; line-height: 1.22; font-weight: 500; font-stretch: 90%; }
  .url { position: absolute; left: 64px; bottom: 44px; font: 500 20px 'IBM Plex Mono', monospace; color: #55524b; }
  .win { position: absolute; background: #fff; border: 1.5px solid #0F0F0F; box-shadow: 8px 8px 0 #0F0F0F; overflow: hidden; }
  .win .t { height: 30px; padding: 0 12px; display: flex; align-items: center; font: 500 15px 'IBM Plex Mono', monospace; background: #fff; border-bottom: 1.5px solid #0F0F0F; }
  .win img { display: block; width: 100%; object-fit: cover; }
  .a { left: 566px; top: 48px; width: 574px; }
  .a img { height: 323px; }
  .b { left: 506px; top: 356px; width: 340px; }
  .b .box { height: 200px; background: #fff url(chart.png) no-repeat; background-size: 118% auto; background-position: 53% 33%; }
  .c { left: 874px; top: 380px; width: 266px; background: #fff; }
  .c img { height: 190px; }
</style>
</head>
<body>
  <div class="rule"></div>
  <h1>Austin<br>Nguyen</h1>
  <p class="line">Data engineering, machine learning, and the software around them.</p>
  <div class="url">ausnguy.github.io/austin-portfolio</div>

  <div class="win a"><div class="t">parvius / console + phone</div><img src="../../public/casequest/loop-poster.jpg" alt=""></div>
  <div class="win b"><div class="t">experience / 3D chart</div><div class="box"></div></div>
  <div class="win c"><div class="t">interdomain / routing</div><img src="../../public/thumbs/interdomain.png" alt=""></div>
</body>
</html>
