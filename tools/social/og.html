<!doctype html>
<!-- Source for public/og.png (1200x630 link preview and LinkedIn thumbnail). Render with tools/social/render.cjs. -->
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@800&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; }
  body { width: 1200px; height: 630px; position: relative; overflow: hidden; background: #fff; color: #1D2329; font-family: 'Archivo', sans-serif; }
  /* the site's grid: 120px columns, 90px rows */
  .grid { position: absolute; inset: 0; background-image: linear-gradient(#E2E5E9 2px, transparent 2px), linear-gradient(90deg, #E2E5E9 2px, transparent 2px); background-size: 120px 90px; background-position: 60px 0; }
  .cols { position: absolute; left: 0; right: 0; top: 0; height: 60px; background: #F3F5F7; border-bottom: 2px solid #E2E5E9; }
  .cols span { position: absolute; top: 0; width: 120px; height: 60px; line-height: 60px; text-align: center; font: 600 24px 'IBM Plex Mono', monospace; color: #636B75; border-left: 2px solid #E2E5E9; }
  .rows { position: absolute; left: 0; top: 60px; bottom: 0; width: 60px; background: #F3F5F7; border-right: 2px solid #E2E5E9; }
  /* selected cell, like the favicon: green frame plus a fill handle */
  .sel { position: absolute; left: 118px; top: 84px; width: 760px; height: 276px; background: #fff; border: 6px solid #107C41; }
  .sel::after { content: ''; position: absolute; right: -16px; bottom: -16px; width: 22px; height: 22px; background: #107C41; border: 4px solid #fff; }
  h1 { position: absolute; left: 150px; top: 98px; font-family: 'Libre Franklin', sans-serif; font-size: 124px; line-height: .98; letter-spacing: -2.5px; white-space: normal; font-weight: 800; white-space: normal; }
  .line { position: absolute; left: 118px; top: 400px; font: 600 40px 'IBM Plex Mono', monospace; color: #107C41; white-space: nowrap; }
  .tri { position: absolute; left: 856px; top: 90px; width: 0; height: 0; border-top: 22px solid #D93025; border-left: 22px solid transparent; }
  .cmt { position: absolute; left: 912px; top: 96px; width: 240px; padding: 14px 16px; background: #FFF8C5; border: 2px solid #C9B94A; font: 500 28px/1.25 'IBM Plex Sans', sans-serif; color: #1D2329; box-shadow: 4px 4px 0 rgba(29,35,41,.18); }
  .cmt::before { content: ''; position: absolute; left: -54px; top: 14px; width: 54px; height: 2px; background: #C9B94A; transform: rotate(-8deg); transform-origin: right center; }
  .cmt b { display: block; margin-bottom: 4px; font: 600 18px 'IBM Plex Mono', monospace; color: #7a6d1c; }
  .bar { position: absolute; left: 60px; right: 0; bottom: 0; height: 76px; background: #0B4A2B; color: #fff; padding: 0 58px; display: flex; align-items: center; font: 600 32px 'IBM Plex Mono', monospace; }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="cols"><span style="left:60px">A</span><span style="left:180px">B</span><span style="left:300px">C</span><span style="left:420px">D</span><span style="left:540px">E</span><span style="left:660px">F</span><span style="left:780px">G</span><span style="left:900px">H</span><span style="left:1020px">I</span><span style="left:1140px">J</span></div>
  <div class="rows"></div>
  <div class="sel"></div>
  <h1>Austin<br>Nguyen</h1>
  <p class="line">=DATA_ENGINEERING + ML + SOFTWARE</p>
  <div class="tri"></div>
  <div class="cmt"><b>Austin Nguyen</b>yes, my portfolio is a spreadsheet</div>
  <div class="bar">ausnguy.github.io/austin-portfolio</div>
</body>
</html>
